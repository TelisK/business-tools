{% extends 'income_expenses/base.html' %}
{% block body %}

<h1>Επεξεργασία Τιμολογίου</h1>
<div>
 <form method="POST">
{% csrf_token %}
            <div class="form-group">
                <label>Προμηθευτής</label>
                {{ form.supplier }}
</div>


            <div class="form-group">
                <label>Αριθμός Τιμολογίου</label>
                {{ form.invoice_number }}
</div>


            <div class="form-group">
                <label>Ημερομηνία</label>
                {{ form.date }}
</div>

            <div class="form-group">
                <label>Ποσό (€)</label>
                {{ form.amount }}
</div>

                
            <div class="form-group">
                <label>Ποσό ΦΠΑ (€)</label>
                {{ form.fpa }}
</div>

                            <div class="form-group">
                <label>Ποσοστό ΦΠΑ (%)</label>
                {{ form.fpa_persentage }}
</div>

                            <div class="form-group">
                <label>Τελικό Σύνολο (€)</label>
                {{ form.total }}
</div>

                        <div class="form-actions">

            <button type="submit" class="btn btn-primary">Αποθήκευση</button>
            <a href="{% url 'invoices:invoice_list' %}" class="btn btn-secondary">Ακύρωση</a>
            </div>

</form>               
</div>

{% endblock %}
