{% extends 'income_expenses/base.html' %}
{% block body %}

<h1>Επεξεργασία Προμηθευτή</h1>
<div>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Προμηθευτής</label>
            {{ form.supplier }}
        </div>


        <div class="form-group">
            <label>ΑΦΜ</label>
            {{ form.afm }}
        </div>

        <div class="form-actions">

            <button type="submit" class="btn btn-primary">Αποθήκευση</button>
            <a href="{% url 'invoices:invoice_supplier' %}" class="btn btn-secondary">Ακύρωση</a>
        </div>

    </form>
</div>

{% endblock %}
