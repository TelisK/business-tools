{% extends 'income_expenses/base.html' %}
{% load static %}

<!-- Load extra css file -->
{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/style.css' %}">
{% endblock %}

{% block body %}

<div class="password-reset-form">
    <h1>Επαναφορά κωδικού</h1>
    <form method="post">

        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group full">
                <label for="">Email του λογαριασμού:</label>
                {{ form.email }}
            </div>
        </div>
        <div class="pass-reset-form-actions">
            <button type="submit" class="btn-green">Αποστολή</button>
    </form>
</div>

{% endblock %}
