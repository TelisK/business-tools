services:
  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
         python manage.py migrate &&
         gunicorn business_tools.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --access-logfile - --error-logfile -"
    volumes:
      - ./static:/app/static
      - backups:/backups
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env

  nginx:
      image: nginx:latest
      restart: always
      ports:
        - "80:80"
      volumes:
        - ./nginx:/etc/nginx/conf.d:ro  
        - ./static:/app/static:ro  # Ο Nginx διαβάζει τα static (Read-Only)
        - ./income_expenses/static:/app/income_expenses/static:ro
        - ./invoices/static:/app/invoices/static:ro
        - ./ai_assistant/static:/app/ai_assistant/static:ro
        - ./accounts/static:/app/accounts/static:ro
      depends_on:
        - web

  redis:
    image: redis:latest
    restart: always

volumes:
  postgres_data:
  backups: